<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rain Guessr map">
    <title>Rain Guessr Map</title>
    <link id="stylesheet" rel="stylesheet" href='../css/map.css'>

    <!-- Load order matters: render first (defines gl, canvas, renderRoom),
         then map_loader (fetches data, calls renderRoom),
         then room_detection (reads canvas + roomBoundaries) -->
    <script src="../js/Map/render.js"              defer></script>
    <script src="../js/Map/map_loader.js"          defer></script>
    <script src="../js/Map/room_detection.js"      defer></script>
    <script src="../js/moving_map_script.js"       defer></script>

    <link rel="icon" href="../pictures/ico/survivor_head1.ico">

    <style>
        /* Hide scrollbars — navigation is via right click drag, arrow keys, scroll wheel */
        html, body {
            margin: 0;
            overflow: hidden;
            width: 100%; height: 100%;
            background: #000;
        }

        #canvas-wrapper {
            position: absolute; /* out of flow so it never causes scrollbars */
            top: 0; left: 0;
            width: 10000px;
            height: 6000px;
            transform-origin: top left;
        }
        #canvas, #canvas-overlay {
            position: absolute;
            top: 0; left: 0;
        }
        /* Overlay never captures mouse events — WebGL canvas handles them */
        #canvas-overlay {
            pointer-events: none;
            z-index: 1;
        }

        #room-tooltip {
            display: none;
            position: fixed;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            color: #00ff00;
            font-family: monospace;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #00ff00;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="canvas-wrapper">
        <!-- WebGL canvas: draws room geometry lines in red -->
        <canvas id="canvas"         width="10000" height="6000"></canvas>
        <!-- 2D overlay canvas: draws the green boundary highlight on hover -->
        <canvas id="canvas-overlay" width="10000" height="6000"></canvas>
    </div>

    <!-- Tooltip: positioned and shown/hidden by room_detection.js -->
    <div id="room-tooltip"></div>
</body>
</html>
