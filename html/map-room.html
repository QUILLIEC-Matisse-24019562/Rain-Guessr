<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rain Guessr map">
    <title>Rain Guessr Map</title>
    <link id="stylesheet" rel="stylesheet" href='../css/map.css'>

    <!-- Load order matters: render first basic, 
         then (defines gl, canvas, renderRoom),
         then map_loader (fetches data, calls renderRoom),
         then room_detection (reads canvas + roomBoundaries) -->
    <script src="../js/style.js"                   defer></script>
    <script src="../js/Map/render.js"              defer></script>
    <script src="../js/Map/map_loader.js"          defer></script>
    <script src="../js/Map/room_detection.js"      defer></script>
    <script src="../js/Map/connection_loader.js"   defer></script>
    <script src="../js/moving_map_script.js"       defer></script>

    <link rel="icon" href="../pictures/ico/survivor_head1.ico">
</head>
<body>
    <button type="button"><a href="../index.html" id="text-button">BACK</a> </button>
            
    <div id="canvas-wrapper">
        <!-- Layer 0 — WebGL: room geometry lines in red -->
        <canvas id="canvas"             width="10000" height="6000"></canvas>
        <!-- Layer 1 — 2D: connection lines between rooms -->
        <canvas id="canvas-connections" width="10000" height="6000" style="pointer-events:none; position:absolute; top:0; left:0; z-index:1;"></canvas>
        <!-- Layer 2 — 2D: green boundary highlight on hover -->
        <canvas id="canvas-overlay"     width="10000" height="6000" style="pointer-events:none; position:absolute; top:0; left:0; z-index:2;"></canvas>
    </div>

    <!-- Tooltip: positioned and shown/hidden by room_detection.js -->
    <div id="room-tooltip"></div>
</body>
</html>
