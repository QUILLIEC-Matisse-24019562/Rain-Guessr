<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rain Guessr map">
    <title>Rain Guessr Map</title>
    <link id="stylesheet" rel="stylesheet" href='../css/map.css'>

    <!-- Load order: render first (gl, canvas), map_loader (data),
         room_detection (hover), connection_loader (lines), moving_map (pan/zoom) -->
    <script src="../js/Map/render.js"              defer></script>
    <script src="../js/Map/map_loader.js"          defer></script>
    <script src="../js/Map/room_detection.js"      defer></script>
    <script src="../js/Map/connection_loader.js"   defer></script>
    <script src="../js/moving_map_script.js"       defer></script>

    <link rel="icon" href="../pictures/ico/survivor_head1.ico">

    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            width: 100%; height: 100%;
            background: #000;
        }

        /* All canvases are viewport-sized and stacked */
        #canvas-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #canvas, #canvas-connections, #canvas-overlay {
            position: absolute;
            top: 0; left: 0;
            /* width/height set dynamically by render.js resizeCanvas() */
        }
        #canvas-connections, #canvas-overlay {
            pointer-events: none;
            z-index: 1;
        }
        #canvas-overlay { z-index: 2; }

        #room-tooltip {
            display: none;
            position: fixed;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            color: #00ff00;
            font-family: monospace;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #00ff00;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <button type="button"><a href="../index.html">BACK</a> </button>
    <div id="canvas-wrapper">
        <!-- Layer 0: WebGL room geometry -->
        <canvas id="canvas"></canvas>
        <!-- Layer 1: 2D connection lines -->
        <canvas id="canvas-connections"></canvas>
        <!-- Layer 2: 2D hover highlight -->
        <canvas id="canvas-overlay"></canvas>
    </div>

    <div id="room-tooltip"></div>
</body>
</html>
